name: Mirror to Masters Gym backup repo

# Copies this repo to a repo in Masters Gym's own GitHub account after every
# change, so they always hold an up-to-date backup. The live site is still
# served from THIS repo, so edits made in the backup never go live, and the
# next mirror run overwrites them.
#
# Setup (once):
#   1. Masters Gym creates an empty PRIVATE repo, adds the public deploy key
#      with "Allow write access", and disables Actions on that repo.
#   2. In this repo: Settings > Secrets and variables > Actions
#        Secret   MIRROR_SSH_KEY = the private deploy key
#        Variable MIRROR_REPO    = owner/repo of their backup repo
# Until both exist, this workflow skips quietly.

on:
  push:
    branches: [main]
  schedule:
    - cron: '23 2 * * *'   # daily catch-up (bot commits don't trigger push events)
  workflow_dispatch:

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Check setup
        id: cfg
        env:
          KEY: ${{ secrets.MIRROR_SSH_KEY }}
          REPO: ${{ vars.MIRROR_REPO }}
        run: |
          if [ -z "$KEY" ] || [ -z "$REPO" ]; then
            echo "Mirror not configured yet, skipping."; echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.cfg.outputs.ready == 'true'
        with:
          fetch-depth: 0

      - name: Push to backup repo
        if: steps.cfg.outputs.ready == 'true'
        env:
          KEY: ${{ secrets.MIRROR_SSH_KEY }}
          REPO: ${{ vars.MIRROR_REPO }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/mirror_key && chmod 600 ~/.ssh/mirror_key
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/mirror_key -o IdentitiesOnly=yes"
          git push --force "git@github.com:${REPO}.git" HEAD:main
